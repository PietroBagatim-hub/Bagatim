<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIETRO BAGATIM - Negócios, Ativos & Educacional</title>

    <!-- Meta Tags para Prévia no WhatsApp / Redes Sociais (Open Graph) -->
    <!-- MANTIDO: Isso garante que o brasão apareça no compartilhamento -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.bagatim.com/">
    <meta property="og:title" content="PIETRO BAGATIM NEGOCIOS & ATIVOS">
    <meta property="og:description" content="Avaliação patrimonial e mercadológica para processos, inventários e partilhas. Gestão especializada em compra, venda e administração de imóveis.">
    <meta property="og:image" content="https://www.bagatim.com/preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { display: flex; height: 100vh; width: 100vw; overflow: hidden; background-color: #0d1117; }

        /* Estilos da Página Dividida (Split Screen) */
        .split { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-decoration: none; color: #ffffff; transition: all 0.4s ease; padding: 30px; text-align: center; position: relative; }
        
        /* Cores e Gradientes */
        .left { background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); border-right: 1px solid rgba(255, 255, 255, 0.1); }
        .right { background: linear-gradient(135deg, #1e130c, #3a1c71, #d76d77); }
        
        /* Efeitos de Hover */
        .split:hover { flex: 1.25; filter: brightness(1.15); }
        
        /* Conteúdo dos Blocos */
        .icon { font-size: 3.5rem; margin-bottom: 20px; }
        h2 { font-size: 2rem; font-weight: 700; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1.5px; }
        p { font-size: 1.05rem; opacity: 0.9; max-width: 360px; line-height: 1.5; }
        
        /* Botões */
        .btn { margin-top: 30px; padding: 14px 32px; border: 2px solid #ffffff; border-radius: 30px; font-weight: 600; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1.2px; transition: background 0.3s, color 0.3s; }
        .split:hover .btn { background: #ffffff; color: #111111; }

        /* Responsividade para Celulares */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .split:hover { flex: 1; }
            .left { border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
            .icon { font-size: 2.8rem; margin-top: 30px; margin-bottom: 10px; }
            h2 { font-size: 1.4rem; }
            p { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- LADO ESQUERDO: IMÓVEIS -->
    <a href="https://www.bagatimimoveis.com" class="split left">
        <div class="icon">🏢</div>
        <h2>Imóveis, Negócios & Avaliações</h2>
        <p>Intermediação imobiliária, consultoria de ativos e pareceres técnicos de avaliação mercadológica.</p>
        <div class="btn">Acessar Imóveis</div>
    </a>

    <!-- LADO DIREITO: EDUCACIONAL -->
    <a href="https://www.bagatimeducacional.com" class="split right">
        <div class="icon">🎓</div>
        <h2>Educacional & Treinamentos</h2>
        <p>Cursos, treinamentos profissionais, conteúdos didáticos e desenvolvimento acadêmico.</p>
        <div class="btn">Acessar Educacional</div>
    </a>

</body>
</html>
